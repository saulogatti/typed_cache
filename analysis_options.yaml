# schema: https://dart.dev/tools/analysis-options

include: package:lints/recommended.yaml

formatter:
  page_width: 100
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    missing_override_of_must_be_overridden: error